name: Build & Update Luau Libraries

permissions:
  contents: write

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/main.yml'
    tags:
      - 'v*'

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check-changes.outputs.should-build }}
      latest-commit: ${{ steps.check-changes.outputs.latest-commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for updates in luau-lang/luau
        id: check-changes
        run: |
          LATEST_COMMIT=$(git ls-remote https://github.com/luau-lang/luau HEAD | awk '{print $1}')
          if [ -f .last_luau_commit ]; then
            LAST_COMMIT=$(cat .last_luau_commit)
          else
            LAST_COMMIT=""
          fi
          
          if [ "$LATEST_COMMIT" != "$LAST_COMMIT" ]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "latest-commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT
            echo "New commit detected: $LATEST_COMMIT"
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "latest-commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
            echo "No new commits found"
          fi

  build-windows:
    needs: check-updates
    if: needs.check-updates.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Clone Luau repository
        run: |
          git clone https://github.com/luau-lang/luau.git luau-build
          cd luau-build
          git log -1 --oneline

      - name: Patch Luau TypeChecker warning
        shell: bash
        run: |
          cd luau-build
          python - <<'PY'
          from pathlib import Path
          path = Path("Analysis/src/TypeChecker2.cpp")
          marker = "lookupAnnotation(ref->parameters.data 0 .type)"
          replacement = "lookupAnnotation(ann)"
          if path.exists():
              text = path.read_text()
              if marker in text:
                  path.write_text(text.replace(marker, replacement, 1))
                  print("patched TypeChecker2.cpp")
              else:
                  print("marker not found; skipping patch")
          PY

      - name: Patch Luau CMakeLists MSVC guard
        shell: bash
        run: |
          cd luau-build
          # 上游 CMakeLists 在 "if(MSVC AND LUAU_BUILD_CLI)" 块里引用了 Luau.UnitTest，
          # 但该目标只在 LUAU_BUILD_TESTS=ON 时存在，会导致 MSVC 配置阶段报错。
          python - <<'PY'
          from pathlib import Path
          path = Path("CMakeLists.txt")
          marker = "if(MSVC AND LUAU_BUILD_CLI)"
          replacement = "if(MSVC AND LUAU_BUILD_CLI AND LUAU_BUILD_TESTS)"
          text = path.read_text()
          if marker in text:
              path.write_text(text.replace(marker, replacement, 1))
              print("patched CMakeLists.txt MSVC/CLI guard")
          else:
              print("marker not found; skipping patch")
          PY

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build Luau (Windows x64)
        run: |
          cd luau-build
          mkdir build-release
          cd build-release
          cmake .. -DCMAKE_BUILD_TYPE=Release -A x64 -DBUILD_TESTING=OFF -DLUAU_BUILD_TESTS=OFF
          cmake --build . --config Release

      - name: Setup LLVM and Compression Tools
        shell: pwsh
        run: |
          choco install llvm 7zip -y
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.2/upx-4.2.2-win64.zip" -OutFile "upx.zip"
          Expand-Archive -Path "upx.zip" -DestinationPath "."
          $upxFolder = Get-ChildItem -Directory -Filter "upx-*" | Select-Object -First 1
          Move-Item "$($upxFolder.FullName)/upx.exe" "upx.exe" -Force

      - name: Process Windows Libraries
        shell: pwsh
        run: |
          mkdir -p artifacts/windows-x64/lib
          Copy-Item luau-build/build-release/Release/*.lib artifacts/windows-x64/lib/
          
          if (Test-Path "luau-build/build-release/Release/*.dll") {
            Copy-Item luau-build/build-release/Release/*.dll artifacts/windows-x64/lib/
            $upxPath = Join-Path $PWD "upx.exe"
            Get-ChildItem artifacts/windows-x64/lib -Filter "*.dll" | ForEach-Object {
              & $upxPath --best $_.FullName
            }
          }

          # NOTE: 不要在这里把 >90MB 的 .lib 换成 .7z —— linc_lua.xml 链接时需要原始 .lib。
          # GitHub 单文件推送上限为 100MB，这里对超限文件直接报错，避免静默丢失。
          Get-ChildItem artifacts/windows-x64/lib -Filter "*.lib" | ForEach-Object {
            Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
            if ($_.Length -gt 100MB) {
              throw "Static lib exceeds GitHub 100MB push limit: $($_.Name)"
            }
          }
          
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-libs
          path: artifacts/windows-x64/

  build-linux:
    needs: check-updates
    if: needs.check-updates.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Clone Luau repository
        run: git clone https://github.com/luau-lang/luau.git luau-build

      - name: Patch Luau TypeChecker warning
        run: |
          cd luau-build
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Analysis/src/TypeChecker2.cpp")
          marker = "lookupAnnotation(ref->parameters.data 0 .type)"
          replacement = "lookupAnnotation(ann)"
          if path.exists():
              text = path.read_text()
              if marker in text:
                  path.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake p7zip-full

      - name: Build Luau (Linux x64)
        run: |
          cd luau-build
          mkdir build-release
          cd build-release
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DLUAU_BUILD_TESTS=OFF
          cmake --build . --config Release -j$(nproc)

      - name: Collect and Ultra Compress Linux Libraries
        run: |
          mkdir -p artifacts/linux-x64/lib
          find luau-build/build-release -name "*.a" -exec cp {} artifacts/linux-x64/lib/ \;
          find luau-build/build-release -name "*.so" -exec cp {} artifacts/linux-x64/lib/ \; 2>/dev/null || true
          
          if [ -d "artifacts/linux-x64/lib" ]; then
            # Strip debug symbols from static libs to reduce size
            find artifacts/linux-x64/lib/ -name "*.a" -exec strip --strip-debug {} \;
            
            shopt -s nullglob
            for lib in artifacts/linux-x64/lib/*.so; do
              strip --strip-unneeded "$lib"
            done
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-libs
          path: artifacts/linux-x64/

  build-macos:
    needs: check-updates
    if: needs.check-updates.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [ x86_64, arm64 ]
    steps:
      - name: Clone Luau repository
        run: git clone https://github.com/luau-lang/luau.git luau-build

      - name: Build Luau (macOS ${{ matrix.arch }})
        run: |
          cd luau-build
          mkdir build-release-${{ matrix.arch }}
          cd build-release-${{ matrix.arch }}
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DBUILD_TESTING=OFF -DLUAU_BUILD_TESTS=OFF
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Collect and Compress macOS Libraries
        run: |
          mkdir -p artifacts/macos-${{ matrix.arch }}/lib
          find luau-build/build-release-${{ matrix.arch }} -name "*.a" -exec cp {} artifacts/macos-${{ matrix.arch }}/lib/ \;
          
          # Strip debug info to reduce size
          for lib in artifacts/macos-${{ matrix.arch }}/lib/*.a; do
            strip -S "$lib"
          done

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-libs
          path: artifacts/macos-${{ matrix.arch }}/

  build-android:
    needs: check-updates
    if: needs.check-updates.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [ armv7, arm64-v8a, x86, x86_64 ]
    steps:
      - name: Clone Luau repository
        run: git clone https://github.com/luau-lang/luau.git luau-build

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Luau (Android ${{ matrix.abi }})
        run: |
          cd luau-build
          mkdir build-android
          cd build-android
          ABI="${{ matrix.abi }}"
          if [ "$ABI" = "armv7" ]; then ABI="armeabi-v7a"; fi
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build . --config Release -j$(nproc)
          
          # IMPORTANT: Strip debug symbols to fix 177MB file size issue
          echo "Stripping binaries..."
          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          find . -name "*.a" -exec "$TOOLCHAIN_BIN/llvm-strip" --strip-debug {} \;

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}-libs
          path: luau-build/build-android/*.a

  build-ios:
    needs: check-updates
    runs-on: macos-latest
    strategy:
      matrix:
        sdk: [ iphoneos, iphonesimulator ]
    steps:
      - name: Clone Luau repository
        run: git clone https://github.com/luau-lang/luau.git luau-build
  
      - name: Build Luau (iOS ${{ matrix.sdk }})
        run: |
          cd luau-build
          mkdir build-ios
          cd build-ios

          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then
            ARCH="arm64"
          else
            ARCH="x86_64;arm64"
          fi
  
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} \
            -DCMAKE_OSX_ARCHITECTURES="$ARCH" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUAU_BUILD_TESTS=OFF \
            -DLUAU_BUILD_CLI=OFF \
            -DLUAU_BUILD_WEB=OFF \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
  
          cmake --build . --config Release -j 2
          
          # Strip debug info
          find . -name "*.a" -exec strip -S {} \;
      
      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.sdk }}-libs
          path: luau-build/build-ios/*.a

  create-release:
    needs: [ check-updates, build-windows, build-linux, build-macos, build-android, build-ios ]
    if: always() && (needs.check-updates.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Show downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find all-artifacts -type f | sort || true

      - name: Prepare and Push Libraries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Define base directory
          BASE_LIB="lib/luau/lib"
          
          # Clean old libraries to ensure we don't have stale files
          rm -rf $BASE_LIB
          mkdir -p $BASE_LIB

          # NOTE: output layout must match linc/linc_lua.xml expectations:
          #   windows-x64/lib/*.lib, linux-x64/lib/*.a, macos-x64|macos-arm64/lib/*.a,
          #   android/<armv7|arm64-v8a|x86|x86_64>/lib/*.a,
          #   ios/lib/libLuau.*.iphoneos-64.a / libLuau.*.iphonesim-64.a

          # --- Windows (artifact dir contains a lib/ subfolder) ---
          mkdir -p $BASE_LIB/windows-x64/lib
          cp -r all-artifacts/windows-x64-libs/lib/* $BASE_LIB/windows-x64/lib/ 2>/dev/null || true

          # --- Linux (artifact dir contains a lib/ subfolder) ---
          mkdir -p $BASE_LIB/linux-x64/lib
          cp -r all-artifacts/linux-x64-libs/lib/* $BASE_LIB/linux-x64/lib/ 2>/dev/null || true

          # --- macOS ---
          mkdir -p $BASE_LIB/macos-x64/lib
          cp -r all-artifacts/macos-x86_64-libs/lib/* $BASE_LIB/macos-x64/lib/ 2>/dev/null || true
          mkdir -p $BASE_LIB/macos-arm64/lib
          cp -r all-artifacts/macos-arm64-libs/lib/* $BASE_LIB/macos-arm64/lib/ 2>/dev/null || true

          # --- Android (artifacts are flat *.a, XML expects a lib/ subfolder) ---
          mkdir -p $BASE_LIB/android/armv7/lib
          cp all-artifacts/android-armv7-libs/*.a $BASE_LIB/android/armv7/lib/ 2>/dev/null || true
          
          mkdir -p $BASE_LIB/android/arm64-v8a/lib
          cp all-artifacts/android-arm64-v8a-libs/*.a $BASE_LIB/android/arm64-v8a/lib/ 2>/dev/null || true
          
          mkdir -p $BASE_LIB/android/x86/lib
          cp all-artifacts/android-x86-libs/*.a $BASE_LIB/android/x86/lib/ 2>/dev/null || true
          
          mkdir -p $BASE_LIB/android/x86_64/lib
          cp all-artifacts/android-x86_64-libs/*.a $BASE_LIB/android/x86_64/lib/ 2>/dev/null || true

          # --- iOS (XML expects flattened sdk-suffixed names: libLuau.VM.iphoneos-64.a) ---
          mkdir -p $BASE_LIB/ios/lib
          for f in all-artifacts/ios-iphoneos-libs/libLuau.*.a; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .a)
            cp "$f" "$BASE_LIB/ios/lib/${base}.iphoneos-64.a"
          done
          for f in all-artifacts/ios-iphonesimulator-libs/libLuau.*.a; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .a)
            cp "$f" "$BASE_LIB/ios/lib/${base}.iphonesim-64.a"
          done

          echo "=== Final library tree ==="
          find $BASE_LIB -type f | sort

          # --- Verify: artifact 存在但目标目录为空时直接失败，避免静默丢失桌面端库 ---
          verify() {
            local artifact_dir="$1" dest_dir="$2" label="$3"
            if [ -d "$artifact_dir" ] && [ -n "$(find "$artifact_dir" -type f \( -name '*.a' -o -name '*.lib' \) -print -quit 2>/dev/null)" ]; then
              if [ -z "$(find "$dest_dir" -type f \( -name '*.a' -o -name '*.lib' \) -print -quit 2>/dev/null)" ]; then
                echo "::error::$label artifacts were produced but no libs were copied into $dest_dir"
                exit 1
              fi
              echo "OK: $label -> $dest_dir"
            else
              echo "::warning::No $label artifacts found (build job skipped or failed?)"
            fi
          }
          verify all-artifacts/windows-x64-libs        $BASE_LIB/windows-x64/lib        "Windows x64"
          verify all-artifacts/linux-x64-libs          $BASE_LIB/linux-x64/lib          "Linux x64"
          verify all-artifacts/macos-x86_64-libs       $BASE_LIB/macos-x64/lib          "macOS x64"
          verify all-artifacts/macos-arm64-libs        $BASE_LIB/macos-arm64/lib        "macOS arm64"
          verify all-artifacts/android-armv7-libs      $BASE_LIB/android/armv7/lib      "Android armv7"
          verify all-artifacts/android-arm64-v8a-libs  $BASE_LIB/android/arm64-v8a/lib  "Android arm64-v8a"
          verify all-artifacts/android-x86-libs        $BASE_LIB/android/x86/lib        "Android x86"
          verify all-artifacts/android-x86_64-libs     $BASE_LIB/android/x86_64/lib     "Android x86_64"
          verify all-artifacts/ios-iphoneos-libs       $BASE_LIB/ios/lib                "iOS iphoneos"
          verify all-artifacts/ios-iphonesimulator-libs $BASE_LIB/ios/lib               "iOS iphonesimulator"

          # Commit and Push
          git add -f $BASE_LIB
          
          # Check if there are changes before committing
          if ! git diff --cached --quiet; then
            git commit -m "Update prebuilt Luau libraries: ${{ needs.check-updates.outputs.latest-commit }}"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi

      - name: Update last commit hash
        run: |
          echo "${{ needs.check-updates.outputs.latest-commit }}" > .last_luau_commit
          git add .last_luau_commit
          git commit -m "chore: update sync hash" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
